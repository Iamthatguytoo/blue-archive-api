name: Scraper

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Check IP
        run: |
          echo "Public IP:"
          curl -s https://api.ipify.org
          echo

      - name: Run Student scraper
        env:
          ENVIRONMENT: production
          CLIENT: ${{ secrets.CLIENT }}
          DATABASE: ${{ secrets.DATABASE }}
          API_COLLECTION_BANNER_SCRAPER: ${{ secrets.API_COLLECTION_BANNER_SCRAPER }}
          API_COLLECTION_SCRAPER: ${{ secrets.API_COLLECTION_SCRAPER }}
        run: |
          python -m workers.blue_archive_characters

      - name: Run Banner scraper
        env:
          ENVIRONMENT: production
          CLIENT: ${{ secrets.CLIENT }}
          DATABASE: ${{ secrets.DATABASE }}
          API_COLLECTION_BANNER_SCRAPER: ${{ secrets.API_COLLECTION_BANNER_SCRAPER }}
          API_COLLECTION_SCRAPER: ${{ secrets.API_COLLECTION_SCRAPER }}
        run: |
          python -m workers.banner_scraper
