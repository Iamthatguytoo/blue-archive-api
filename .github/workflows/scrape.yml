name: Scraper

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
    student_scrape:
        runs-on: ubuntu-latest

        outputs:
          updated: ${{ steps.student_scrape.outputs.updated }}

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: '3.11'
                  cache: 'pip'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  playwright install chromium
            
            - name: Run Student scraper
              id: student_scrape
              env:
                ENVIRONMENT: production
                CLIENT: ${{ secrets.CLIENT }}
                DATABASE: ${{ secrets.DATABASE }}
                API_COLLECTION_BANNER_SCRAPER: ${{ secrets.API_COLLECTION_BANNER_SCRAPER }}
                API_COLLECTION_SCRAPER: ${{ secrets.API_COLLECTION_SCRAPER }}
              run: |
               python -m workers.blue_archive_characters

    banner_scrape:
        runs-on: ubuntu-22.04

        outputs:
          updated: ${{ steps.banner_scraper.outputs.updated }}

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: '3.11'
                  cache: 'pip'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  playwright install chromium
            
            - name: Run Banner scraper
              id: banner_scraper
              env:
                ENVIRONMENT: production
                CLIENT: ${{ secrets.CLIENT }}
                DATABASE: ${{ secrets.DATABASE }}
                API_COLLECTION_BANNER_SCRAPER: ${{ secrets.API_COLLECTION_BANNER_SCRAPER }}
                API_COLLECTION_SCRAPER: ${{ secrets.API_COLLECTION_SCRAPER }}
              run: |
               python -m workers.banner_scraper

    banner_scrape_check:
      needs: banner_scrape
      runs-on: ubuntu-latest

      if: needs.banner_scrape.outputs.updated == 'true'

      steps:
        - name: Banner scraper success
          run: echo "banner_scrape detected new banners"

    student_scrape_check:
      needs: student_scrape
      runs-on: ubuntu-latest

      if: needs.student_scrape.outputs.updated == 'true'

      steps:
        - name: Banner scraper success
          run: echo "student_scrape updated after 2 weeks"